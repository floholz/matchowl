# Matchowl — one container: the Go binary serves the API and the embedded SPA.
#
#   docker compose pull && docker compose up -d       # the CI image of MATCHOWL_VERSION
#   docker compose up --build -d                      # or build from this checkout
#
# Runs next to the old WC 2026 app on the same host without touching it:
# its own container, network and volume, and HTTP_PORT picks the host port.
services:
  app:
    build:
      context: .
      args:
        VERSION: ${MATCHOWL_VERSION:-dev}
    container_name: matchowl
    image: ghcr.io/floholz/matchowl:${MATCHOWL_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:8090"
    environment:
      - MATCHOWL_DEV=${MATCHOWL_DEV:-}
      # Public origin (mail links, OAuth redirect) and who runs it.
      - APP_URL=${APP_URL:-}
      - OPERATOR_NAME=${OPERATOR_NAME:-}
      - OPERATOR_LOCATION=${OPERATOR_LOCATION:-}
      # Sign-up switch (0 = private testing, invite existing accounts only).
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-}
      - UNVERIFIED_PURGE_DAYS=${UNVERIFIED_PURGE_DAYS:-}
      # Match data.
      - API_FOOTBALL_KEY=${API_FOOTBALL_KEY:-}
      - RESULTS_SOURCE=${RESULTS_SOURCE:-}
      - SYNC_CRON=${SYNC_CRON:-}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Email notifications (see .env.example).
      - MAIL_PROVIDER=${MAIL_PROVIDER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAILJET_API_KEY=${MAILJET_API_KEY:-}
      - MAILJET_SECRET=${MAILJET_SECRET:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - NOTIFY_CRON=${NOTIFY_CRON:-}
      - NOTIFY_DISABLED=${NOTIFY_DISABLED:-}
      - NOTIFY_ALLOWLIST=${NOTIFY_ALLOWLIST:-}
      - NOTIFY_LOG_LEVEL=${NOTIFY_LOG_LEVEL:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Pool chat: push cadence, email-digest cadence, and the KLIPY GIF key.
      - CHAT_NOTIFY_CRON=${CHAT_NOTIFY_CRON:-}
      - CHAT_DIGEST_CRON=${CHAT_DIGEST_CRON:-}
      - KLIPY_API_KEY=${KLIPY_API_KEY:-}
      # Support / contact links shown in the app (see .env.example).
      - KOFI_URL=${KOFI_URL:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
    volumes:
      - pb_data:/pb_data
    networks: [matchowl]

volumes:
  pb_data:

networks:
  matchowl:
    name: matchowl
    driver: bridge
