name: Release

# On a version tag (v1.3.5, v1.0.0-alpha.1): build and push the image to
# GHCR, then publish the GitHub release with the matching CHANGELOG section.
# Image tags: 1.3.5 (+ 1 and latest for a proper release); a pre-release
# tag (anything with a "-") only gets its own tag, never latest.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.3.5 -> 1.3.5, 1, latest · v1.0.0-alpha.1 -> 1.0.0-alpha.1 only
          # (semver skips {{major}} for pre-releases; latest is gated below).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # OCI labels live in the Dockerfile; feed it the dynamic values.
          # VERSION also gets stamped into the binary (Home footer).
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          # The section "## [<version>] - <date>" up to the next "## [".
          awk -v v="$v" '
            /^## \[/ { on = index($0, "[" v "]") > 0; if (on) next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $v" > notes.md
          fi
          printf '\n---\nImage: `ghcr.io/%s:%s`\n' "$IMAGE_NAME" "$v" >> notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          # alpha / beta / rc tags are pre-releases on GitHub.
          prerelease: ${{ contains(github.ref_name, '-') }}
